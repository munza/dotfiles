# Weekly input updates. The PR's flake.lock diff is the change to review; a PR
# only opens if every host still builds with the new inputs.
name: Update flake inputs

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    # Builds the hosts itself: PRs opened with the workflow's token don't trigger CI.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          # Prebuilt llm-agents packages (Claude Code, pi) used by hosts/macmini.
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Update all inputs
        run: nix flake update

      - name: Build every host
        run: nix flake check --all-systems

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/update-flake-inputs
          delete-branch: true
          title: Update flake inputs
          commit-message: Update flake.lock
          body: |
            Weekly `nix flake update`. The `flake.lock` diff is the change to review;
            every host already built with these inputs.
