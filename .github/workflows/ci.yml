name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      # Full history so the leak scan covers every commit, not just the tip.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31

      - name: Leak scan
        run: nix run --inputs-from . nixpkgs#gitleaks -- git --redact --no-banner

      # Builds this system's checks (formatting included) and evaluates the rest.
      - name: Flake check
        run: nix flake check --all-systems

  # Builds every host for real (evaluation alone can't catch a failing build),
  # on Apple silicon like the Macs they're for.
  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          # Prebuilt llm-agents packages (Claude Code, pi) used by hosts/macmini.
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Build every host
        run: nix flake check
