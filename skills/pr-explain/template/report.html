<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR explain</title>
<style>
:root {
  --bg: #fafafa; --panel: #ffffff; --raised: #f1f1f4; --border: #e3e3e8; --border-strong: #cfcfd6;
  --text: #18181b; --dim: #62626d; --faint: #9a9aa5;
  --accent: #3b5bdb; --green: #2b7a3d; --red: #c4323a; --yellow: #9a6700; --orange: #b4501a; --purple: #7c4dcc;
  --green-bg: #e9f5ec; --red-bg: #fbeaeb; --yellow-bg: #fbf3df; --orange-bg: #fcece2; --purple-bg: #f1ebfb;
  --code-bg: #f4f4f6;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141518; --panel: #1a1b1f; --raised: #23242a; --border: #2a2b31; --border-strong: #3a3b43;
  --text: #e6e6e9; --dim: #9a9ca6; --faint: #6c6e78;
  --accent: #7aa2f7; --green: #9ece6a; --red: #f7768e; --yellow: #e0af68; --orange: #ff9e64; --purple: #bb9af7;
  --green-bg: #1f2a1c; --red-bg: #2d1c21; --yellow-bg: #2b2418; --orange-bg: #2e2118; --purple-bg: #251f31;
  --code-bg: #111215;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #141518; --panel: #1a1b1f; --raised: #23242a; --border: #2a2b31; --border-strong: #3a3b43;
  --text: #e6e6e9; --dim: #9a9ca6; --faint: #6c6e78;
  --accent: #7aa2f7; --green: #9ece6a; --red: #f7768e; --yellow: #e0af68; --orange: #ff9e64; --purple: #bb9af7;
  --green-bg: #1f2a1c; --red-bg: #2d1c21; --yellow-bg: #2b2418; --orange-bg: #2e2118; --purple-bg: #251f31;
  --code-bg: #111215;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.65 var(--sans); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code { font-family: var(--mono); font-size: 0.86em; background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
pre { margin: 0 0 12px; padding: 12px 14px; background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; overflow-x: auto; font: 13px/1.55 var(--mono); }
pre code { background: none; border: 0; padding: 0; font-size: inherit; }
main { max-width: 920px; margin: 0 auto; padding: 0 16px 80px; }

.top { display: flex; align-items: center; gap: 14px; height: 56px; font: 13px var(--mono); color: var(--dim); border-bottom: 1px solid var(--border); margin-bottom: 36px; }
.top .spacer { flex: 1; }
.icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; border: 1px solid transparent; background: none; color: var(--dim); cursor: pointer; }
.icon-btn:hover { color: var(--text); background: var(--raised); }
.icon-btn svg { width: 16px; height: 16px; }
h1 { font-size: 34px; line-height: 1.2; margin: 0 0 40px; letter-spacing: -0.015em; }

section { margin-top: 48px; }
section:first-of-type { margin-top: 0; }
h2 { display: flex; align-items: center; gap: 10px; font-size: 21px; line-height: 1.3; margin: 0 0 14px; letter-spacing: -0.005em; }
h2 .num { font: 12px var(--mono); color: var(--faint); border: 1px solid var(--border); border-radius: 6px; padding: 1px 7px; }
h3 { font-size: 13px; font-family: var(--mono); font-weight: 500; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 8px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 22px 24px; }
.prose p { margin: 0 0 12px; } .prose p:last-child, .prose ul:last-child, .prose pre:last-child { margin-bottom: 0; }
.prose ul { margin: 0 0 12px; padding-left: 20px; }

/* Herdr's tab bar, for the three ways of telling it. */
.tabs { display: flex; gap: 6px; padding: 6px; background: var(--raised); border: 1px solid var(--border); border-radius: 12px 12px 0 0; border-bottom: 0; overflow-x: auto; scrollbar-width: none; }
.tab { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid transparent; background: none; color: var(--dim); font: 13px var(--mono); cursor: pointer; white-space: nowrap; }
.tab svg { width: 15px; height: 15px; flex: none; }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); background: var(--panel); border-color: var(--border-strong); }
.tab:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.tabbed { border-radius: 0 0 12px 12px; }
.tabbed [role="tabpanel"][hidden] { display: none; }
.what-why { display: grid; gap: 24px; }
.what-why > div + div { padding-top: 22px; border-top: 1px solid var(--border); }
.level { font-size: 17px; line-height: 1.7; }

ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); }
ol.steps li:first-child { border-top: 0; padding-top: 0; }
ol.steps li::before { content: counter(s); display: grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; background: var(--raised); font: 12px var(--mono); color: var(--dim); }
.figure { margin-bottom: 14px; padding: 0; overflow: hidden; }
.figure .stage { padding: 22px 18px 10px; overflow-x: auto; }
.figure .stage svg { display: block; width: 100%; min-width: 560px; height: auto; overflow: visible; }
.player { display: flex; align-items: center; gap: 4px; padding: 8px 12px; border-top: 1px solid var(--border); background: var(--raised); }
.player .sep { flex: 1; }
.figure .mermaid { margin: 0; font: 13px var(--mono); color: var(--dim); white-space: pre-wrap; }
.figure.zoomed .stage { cursor: grab; touch-action: none; }
.figure.panning .stage { cursor: grabbing; }
.figure .stage { user-select: none; -webkit-user-select: none; }
/* Full screen: the native API when the browser allows it, and the same layout as a fixed overlay. */
.figure.full { position: fixed; inset: 0; z-index: 50; margin: 0; border: 0; border-radius: 0; display: flex; flex-direction: column; background: var(--panel); }
.figure.full .stage { flex: 1; min-height: 0; overflow: hidden; display: flex; padding: 24px; }
.figure.full .stage svg { width: 100%; height: 100%; min-width: 0; }
body.has-full { overflow: hidden; }

video { width: 100%; border-radius: 12px; border: 1px solid var(--border); background: #000; display: block; aspect-ratio: 16 / 9; }
details { margin-top: 12px; }
summary { cursor: pointer; color: var(--dim); font: 13px var(--mono); padding: 6px 0; }
summary:hover { color: var(--text); }
.transcript { margin: 8px 0 0; padding: 0; list-style: none; }
.transcript li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); }
.transcript .n { font: 12px var(--mono); color: var(--faint); padding-top: 4px; }

.verdict { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 18px; }
.verdict .badge { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; }
.verdict .badge svg { width: 22px; height: 22px; }
.verdict.merge .badge { background: var(--green-bg); color: var(--green); }
.verdict.changes .badge { background: var(--yellow-bg); color: var(--yellow); }
.verdict.reject .badge { background: var(--red-bg); color: var(--red); }
.verdict strong { display: block; font-size: 18px; margin-bottom: 2px; }
.finding { padding: 0; overflow: hidden; }
.finding + .finding { margin-top: 12px; }
.finding header { display: flex; gap: 12px; align-items: baseline; padding: 18px 24px 0; }
.finding header strong { font-size: 17px; line-height: 1.4; }
.sev { flex: none; height: 22px; padding: 0 8px; border-radius: 6px; font: 11px/22px var(--mono); text-transform: uppercase; letter-spacing: .05em; }
.sev.critical { background: var(--red); color: var(--panel); } .sev.high { background: var(--red-bg); color: var(--red); }
.sev.medium { background: var(--orange-bg); color: var(--orange); } .sev.low { background: var(--raised); color: var(--dim); }
.finding .meta { display: grid; grid-template-columns: 90px 1fr; gap: 6px 14px; padding: 14px 24px; font-size: 14px; }
.finding .meta dt { color: var(--dim); font: 12px/1.9 var(--mono); text-transform: uppercase; letter-spacing: .04em; }
.finding .meta dd { margin: 0; }
.finding .where { font: 13px var(--mono); color: var(--dim); }
.finding .body { padding: 0 24px 18px; }
.finding .fix { border-top: 1px solid var(--border); background: var(--raised); padding: 16px 24px; }
.finding .fix h3 { color: var(--green); }
.empty { color: var(--dim); }
.subhead { margin: 26px 0 10px; }
.spot-group + .spot-group { margin-top: 18px; }
.spot-group > .gh { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font: 13px var(--mono); color: var(--dim); }
.spot { padding: 0; overflow: hidden; }
.spot + .spot { margin-top: 10px; }
.spot header { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; padding: 14px 20px 0; }
.spot header strong { font-size: 15px; }
.spot .why { padding: 6px 20px 12px; font-size: 15px; }
.spot pre { margin: 0; border: 0; border-top: 1px solid var(--border); border-radius: 0; padding: 10px 0; }
.spot pre .l { display: block; padding: 0 16px 0 0; }
.spot pre .l.hl { background: var(--yellow-bg); box-shadow: inset 3px 0 0 var(--yellow); }
.spot pre .ln { display: inline-block; width: 3.6em; padding-right: 14px; text-align: right; color: var(--faint); user-select: none; -webkit-user-select: none; }
.checklist div { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid var(--border); }
.checklist div:first-child { border-top: 0; }
.checklist small { display: block; color: var(--dim); font-size: 13px; }
.st { width: 18px; height: 18px; margin-top: 3px; }
.st.pass { color: var(--green); } .st.fail { color: var(--red); } .st.warn { color: var(--yellow); } .st.na { color: var(--faint); }
@media (max-width: 600px) { h1 { font-size: 26px; } .card { padding: 16px; } .spot, .finding { padding: 0; } .spot header, .spot .why { padding-left: 16px; padding-right: 16px; } .finding header, .finding .meta, .finding .body, .finding .fix { padding-left: 16px; padding-right: 16px; } .finding .meta { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main id="app"></main>
<script>
const DATA = /*DATA*/null;
const ICONS = {
  five: '<circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0M9 9.5h.01M15 9.5h.01"/>',
  ten: '<path d="M4 19.5V5a2 2 0 0 1 2-2h12v15H6a2 2 0 0 0-2 2Zm0 0A2 2 0 0 0 6 22h12"/>',
  grownup: '<path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/>',
  zoomin: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8 11h6M11 8v6"/>',
  zoomout: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8 11h6"/>',
  fit: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6v6H9z"/>',
  full: '<path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/>',
  exitfull: '<path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>',
  pass: '<circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',
  fail: '<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/>',
  warn: '<path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4M12 17h.01"/>',
  na: '<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>',
  merge: '<circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="12" r="2"/><path d="M6 8v8M8 6a10 10 0 0 0 8 6"/>',
  changes: '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  reject: '<circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/>',
};
const icon = (name, cls = "") => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] ?? ""}</svg>`;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
// how.diagram as Mermaid flowchart source. Ids become n0, n1, … so any id is safe; labels are quoted
// with Mermaid's entity codes, and the page escapes the whole source before Mermaid reads it.
function mermaidSource(dg) {
  const nodes = (dg.nodes ?? []).filter((n) => n && n.id != null), ids = new Map(nodes.map((n, i) => [n.id, `n${i}`]));
  const text = (t) => String(t ?? "").replace(/"/g, "#quot;").replace(/[<>]/g, (c) => (c === "<" ? "#lt;" : "#gt;")).replace(/\n/g, " ");
  const lines = [`flowchart ${dg.direction === "down" ? "TD" : "LR"}`];
  for (const n of nodes) lines.push(`  ${ids.get(n.id)}["${text(n.label)}${n.note ? `<br/><small>${text(n.note)}</small>` : ""}"]${n.tone ? `:::${n.tone}` : ""}`);
  (dg.edges ?? []).filter((e) => ids.has(e.from) && ids.has(e.to)).forEach((e, k) =>
    lines.push(`  ${ids.get(e.from)} -->|"${k + 1} · ${text(e.label || e.note || "")}"| ${ids.get(e.to)}`));
  return lines.join("\n");
}
// Escaped first, so the PR's own text can never become markup.
const inline = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
const spoken = (s) => String(s ?? "").replace(/\[\[[^\]]*\]\]/g, "").replace(/\s{2,}/g, " ").trim();
function prose(text) {
  return String(text ?? "").trim().split(/```[a-z]*\n?/).map((part, i) => i % 2
    ? `<pre><code>${esc(part.replace(/\n$/, ""))}</code></pre>`
    : part.trim().split(/\n\s*\n/).filter((b) => b.trim()).map((block) => {
        const lines = block.split("\n");
        if (lines.every((l) => /^\s*- /.test(l))) return `<ul>${lines.map((l) => `<li>${inline(l.replace(/^\s*- /, ""))}</li>`).join("")}</ul>`;
        return `<p>${inline(block)}</p>`;
      }).join("")).join("");
}
const VERDICT = { merge: "Good to merge", changes: "Worth it, after changes", reject: "Don't merge" };
const RANK = { critical: 0, high: 1, medium: 2, low: 3 };
const d = DATA, r = d.review ?? {};
const LEVELS = [
  { id: "five", label: "5 years old" },
  { id: "ten", label: "10 years old" },
  { id: "grownup", label: "Grown-up" },
];
let n = 0;
const section = (title, html) => `<section><h2><span class="num">${String(++n).padStart(2, "0")}</span>${title}</h2>${html}</section>`;
const findings = [...(r.findings ?? [])].sort((a, b) => (RANK[a.severity] ?? 9) - (RANK[b.severity] ?? 9));
const SEVERITIES = Object.keys(RANK);
const spots = (r.checkFirst ?? []).filter((c) => c && RANK[c.severity] != null && c.code);
// One place to read first: where, why, and the PR's own lines with their line numbers.
function spot(c) {
  const start = Number(c.line) || 1, marks = new Set((c.mark ?? []).map(Number));
  const code = String(c.code).replace(/\n$/, "").split("\n").map((l, i) => `<span class="l${marks.has(start + i) ? " hl" : ""}"><span class="ln">${start + i}</span>${esc(l) || " "}</span>`).join("");
  return `<article class="card spot"><header>${c.title ? `<strong>${inline(c.title)}</strong>` : ""}<span class="where">${esc(c.file)}${c.line ? `:${esc(c.line)}` : ""}</span></header>${c.why ? `<div class="why prose">${prose(c.why)}</div>` : ""}<pre><code>${code}</code></pre></article>`;
}

document.title = `#${d.number} ${d.title}`;
document.getElementById("app").innerHTML = `
  <div class="top"><a href="https://github.com/${esc(d.repo)}">${esc(d.repo)}</a><span>#${esc(d.number)}</span>${d.url ? `<a href="${esc(d.url)}">Open on GitHub ↗</a>` : ""}<span class="spacer"></span><button class="icon-btn" id="theme" aria-label="Switch light or dark"></button></div>
  <h1>${inline(d.title)}</h1>
  ${section("About the project", `<div class="card prose">${prose(d.about)}</div>`)}
  ${section("What and why", `
    <div class="tabs" role="tablist" aria-label="Explain it for">${LEVELS.map((l) => `<button class="tab" role="tab" id="tab-${l.id}" aria-controls="panel-${l.id}" aria-selected="false" tabindex="-1">${icon(l.id)}${l.label}</button>`).join("")}</div>
    <div class="card tabbed">${LEVELS.map((l) => `<div role="tabpanel" id="panel-${l.id}" aria-labelledby="tab-${l.id}" hidden><div class="what-why">
      <div><h3>What</h3><div class="prose level">${prose(d.levels?.[l.id]?.what)}</div></div>
      <div><h3>Why</h3><div class="prose level">${prose(d.levels?.[l.id]?.why)}</div></div>
    </div></div>`).join("")}</div>`)}
  ${section("How", `${d.how?.diagram ? `<div class="card figure"><div class="stage"><pre class="mermaid">${esc(mermaidSource(d.how.diagram))}</pre></div>
      <div class="player"><span class="sep"></span><button class="icon-btn" data-act="zout" aria-label="Zoom out" title="Zoom out (−)">${icon("zoomout")}</button><button class="icon-btn" data-act="zin" aria-label="Zoom in" title="Zoom in (+). Pinch or Ctrl-scroll works too; drag to pan.">${icon("zoomin")}</button><button class="icon-btn" data-act="fit" aria-label="Fit the diagram" title="Fit (0)">${icon("fit")}</button><button class="icon-btn" data-act="full" aria-label="Full screen" title="Full screen (F)">${icon("full")}</button></div></div>` : ""}
    <div class="card"><ol class="steps">${(d.how?.steps ?? []).map((s) => `<li><div class="prose">${prose(s)}</div></li>`).join("")}</ol></div>`)}
  ${section("Walkthrough", `<video controls preload="metadata" src="walkthrough.mp4"></video>
    <details><summary>Transcript</summary><ol class="transcript">${(d.walkthrough?.beats ?? []).map((s, i) => `<li><span class="n">${String(i + 1).padStart(2, "0")}</span><div>${inline(spoken(s.narration))}</div></li>`).join("")}</ol></details>`)}
  ${section("Review", `
    <div class="card verdict ${esc(r.verdict)}"><div class="badge">${icon(r.verdict)}</div><div><strong>${VERDICT[r.verdict] ?? ""}</strong><div class="prose">${prose(r.verdictWhy)}</div></div></div>
    ${spots.length ? `<h3 class="subhead">Check these first</h3>${SEVERITIES.filter((s) => spots.some((c) => c.severity === s)).map((s) => {
      const group = spots.filter((c) => c.severity === s);
      return `<div class="spot-group"><div class="gh"><span class="sev ${s}">${s}</span>${group.length} ${group.length === 1 ? "place" : "places"}</div>${group.map(spot).join("")}</div>`;
    }).join("")}` : ""}
    ${(r.checklist ?? []).length ? `<details><summary>Checklist · ${r.checklist.filter((c) => c.status === "pass").length} of ${r.checklist.filter((c) => c.status !== "na").length} pass</summary><div class="card checklist">${r.checklist.map((c) => `<div>${icon(c.status, "st " + esc(c.status))}<span>${inline(c.item)}${c.note ? `<small>${inline(c.note)}</small>` : ""}</span></div>`).join("")}</div></details>` : ""}`)}
  ${section("Findings", `
    ${findings.length ? findings.map((f) => `<article class="card finding">
      <header><span class="sev ${esc(f.severity)}">${esc(f.severity)}</span><strong>${inline(f.title)}</strong></header>
      <dl class="meta"><dt>Impact</dt><dd>${inline(f.impact)}</dd>${f.file ? `<dt>Where</dt><dd class="where">${esc(f.file)}${f.line ? `:${esc(f.line)}` : ""}</dd>` : ""}</dl>
      <div class="body prose">${prose(f.explanation)}</div>
      ${f.fix ? `<div class="fix"><h3>Suggested fix</h3><div class="prose">${prose(f.fix)}</div></div>` : ""}
    </article>`).join("") : '<div class="card empty">No findings.</div>'}`)}
`;

const tabs = document.querySelector('[role="tablist"]');
function select(id, focus) {
  for (const l of LEVELS) {
    const on = l.id === id, b = document.getElementById(`tab-${l.id}`);
    b.setAttribute("aria-selected", on); b.tabIndex = on ? 0 : -1;
    document.getElementById(`panel-${l.id}`).hidden = !on;
    if (on && focus) b.focus();
  }
}
tabs.addEventListener("click", (e) => { const b = e.target.closest(".tab"); if (b) select(b.id.slice(4)); });
tabs.addEventListener("keydown", (e) => {
  const i = LEVELS.findIndex((l) => document.getElementById(`tab-${l.id}`) === document.activeElement);
  const step = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
  if (i >= 0 && step) { e.preventDefault(); select(LEVELS[(i + step + LEVELS.length) % LEVELS.length].id, true); }
});
select(LEVELS.some((l) => l.id === location.hash.slice(1)) ? location.hash.slice(1) : "ten");

// Zoom and pan the How diagram by narrowing the viewBox, so text stays sharp at any size.
// Called once Mermaid has drawn the SVG (see the module script below).
function zoomable(fig) {
  const svg = fig.querySelector(".stage svg"), bar = fig.querySelector(".player");
  if (!svg || !bar || fig.dataset.zoom) return;
  fig.dataset.zoom = "1";
  const stage = fig.querySelector(".stage"), fullBtn = bar.querySelector('[data-act="full"]');
  const [X0, Y0, W0, H0] = [svg.viewBox.baseVal.x, svg.viewBox.baseVal.y, svg.viewBox.baseVal.width, svg.viewBox.baseVal.height];
  const z = { s: 1, x: 0, y: 0 };
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  function apply() {
    const w = W0 / z.s, h = H0 / z.s;
    z.x = clamp(z.x, 0, W0 - w); z.y = clamp(z.y, 0, H0 - h);
    svg.setAttribute("viewBox", `${X0 + z.x} ${Y0 + z.y} ${w} ${h}`);
    fig.classList.toggle("zoomed", z.s > 1.001);
  }
  // Zoom by f around a point given as client coordinates (the middle when there's none).
  function zoom(f, cx, cy) {
    const w = W0 / z.s, h = H0 / z.s, s2 = clamp(z.s * f, 1, 8);
    let px = 0.5, py = 0.5;
    const m = svg.getScreenCTM();
    if (cx != null && m) { const p = new DOMPoint(cx, cy).matrixTransform(m.inverse()); px = clamp((p.x - X0 - z.x) / w, 0, 1); py = clamp((p.y - Y0 - z.y) / h, 0, 1); }
    z.x += (w - W0 / s2) * px; z.y += (h - H0 / s2) * py; z.s = s2; apply();
  }
  const fit = () => { z.s = 1; z.x = z.y = 0; apply(); };
  // In full screen a plain scroll zooms; on the page it takes a pinch or Ctrl/⌘, so the page still scrolls.
  stage.addEventListener("wheel", (e) => {
    if (!(e.ctrlKey || e.metaKey || fig.classList.contains("full"))) return;
    e.preventDefault(); zoom(Math.exp(-e.deltaY * (e.ctrlKey ? 0.012 : 0.0025)), e.clientX, e.clientY);
  }, { passive: false });
  let drag = null;
  stage.addEventListener("pointerdown", (e) => {
    if (z.s <= 1.001 || e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY }; stage.setPointerCapture(e.pointerId); fig.classList.add("panning");
  });
  stage.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const m = svg.getScreenCTM(); if (!m) return;
    z.x -= (e.clientX - drag.x) / m.a; z.y -= (e.clientY - drag.y) / m.d; drag = { x: e.clientX, y: e.clientY }; apply();
  });
  const endDrag = () => { drag = null; fig.classList.remove("panning"); };
  stage.addEventListener("pointerup", endDrag); stage.addEventListener("pointercancel", endDrag);
  stage.addEventListener("dblclick", (e) => (z.s > 1.001 ? fit() : zoom(2, e.clientX, e.clientY)));
  function setFull(on) {
    if (fig.classList.contains("full") === on) return;
    fig.classList.toggle("full", on); document.body.classList.toggle("has-full", on);
    fullBtn.innerHTML = icon(on ? "exitfull" : "full"); fullBtn.setAttribute("aria-label", on ? "Leave full screen" : "Full screen");
    const native = fig.requestFullscreen ?? fig.webkitRequestFullscreen;
    if (on && native && !document.fullscreenElement) Promise.resolve(native.call(fig)).catch(() => {});
    if (!on && document.fullscreenElement === fig) document.exitFullscreen().catch(() => {});
    fit(); if (on) fig.focus?.();
  }
  document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement) setFull(false); });
  fig.tabIndex = -1;
  fig.addEventListener("keydown", (e) => {
    if (e.target.closest("input, textarea")) return;
    const k = e.key;
    if (k === "Escape" && fig.classList.contains("full")) setFull(false);
    else if (k === "+" || k === "=") zoom(1.25);
    else if (k === "-" || k === "_") zoom(0.8);
    else if (k === "0") fit();
    else if (k === "f" || k === "F") setFull(!fig.classList.contains("full"));
    else return;
    e.preventDefault();
  });
  bar.addEventListener("click", (ev) => {
    const act = ev.target.closest("button")?.dataset.act;
    if (act === "zin") zoom(1.4);
    if (act === "zout") zoom(1 / 1.4);
    if (act === "fit") fit();
    if (act === "full") setFull(!fig.classList.contains("full"));
  });
}

const root = document.documentElement, themeBtn = document.getElementById("theme");
const dark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
const paint = () => { themeBtn.innerHTML = icon(dark() ? "sun" : "moon"); };
try { const saved = localStorage.getItem("pr-explain-theme"); if (saved) root.dataset.theme = saved; } catch {}
themeBtn.addEventListener("click", () => { root.dataset.theme = dark() ? "light" : "dark"; try { localStorage.setItem("pr-explain-theme", root.dataset.theme); } catch {} paint(); window.drawDiagram?.(); });
paint();
</script>
<script type="module">
// Mermaid draws the How diagram (it needs the internet; without it the source stays as text).
// securityLevel "strict" keeps the PR's labels as text.
const fig = document.querySelector(".figure"), pre = fig?.querySelector(".mermaid");
if (pre) {
  const source = pre.textContent;
  const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs");
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  window.drawDiagram = async () => {
    const tones = { new: ["--green-bg", "--green"], changed: ["--yellow-bg", "--yellow"], removed: ["--red-bg", "--red"], external: ["--raised", "--border-strong"] };
    const defs = Object.entries(tones).map(([t, [bg, line]]) => `  classDef ${t} fill:${css(bg)},stroke:${css(line)}${t === "removed" || t === "external" ? ",stroke-dasharray:5 4" : ""}`).join("\n");
    mermaid.initialize({
      startOnLoad: false, securityLevel: "strict", theme: "base",
      flowchart: { htmlLabels: true, curve: "basis", padding: 14 },
      themeVariables: {
        fontFamily: css("--sans"), fontSize: "15px", primaryColor: css("--panel"), primaryBorderColor: css("--border-strong"),
        primaryTextColor: css("--text"), lineColor: css("--accent"), edgeLabelBackground: css("--panel"), tertiaryTextColor: css("--dim"),
      },
    });
    const { svg } = await mermaid.render("how-diagram", `${source}\n${defs}`);
    const stage = fig.querySelector(".stage");
    stage.innerHTML = svg;
    const el = stage.querySelector("svg");
    el.removeAttribute("style"); el.removeAttribute("height"); el.setAttribute("width", "100%");
    delete fig.dataset.zoom;
    zoomable(fig);
  };
  await window.drawDiagram();
}
</script>
